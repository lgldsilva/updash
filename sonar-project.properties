# SonarCloud configuration for updash. Consumed by .github/workflows/sonar.yml.
# The server URL and token are passed via env / CLI — no secret lives in this file.
sonar.organization=lgldsilva
sonar.projectKey=lgldsilva_updash
sonar.projectName=updash

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Non-code / generated trees out of the scan so they don't add new_violations
# noise the gate counts.
sonar.exclusions=**/vendor/**,**/dist/**,scripts/**,docs/**,git-push.sh,install.sh,**/*.md

# Coverage produced by the sonar workflow (same packages as COVER_PKGS in
# .github/workflows/ci.yml and .ai-standards.env).
sonar.go.coverage.reportPaths=coverage.out

# Coverage denominator mirrors the CI gate exactly: only internal/model,
# internal/config, internal/sizefmt, internal/cli, internal/retention and
# internal/upgrade are measured. The I/O packages (scanner, tui, cleaner,
# updater, elevate, platform) are race-tested without the 90% floor — same
# boundary as COVER_PKGS. Keep this list in sync with .ai-standards.env.
sonar.coverage.exclusions=cmd/**,internal/scanner/**,internal/tui/**,internal/cleaner/**,internal/updater/**,internal/elevate/**,internal/platform/**,test/**

# The gate is real: the scanner waits for the quality-gate verdict and exits
# non-zero when it fails (no false-green).
sonar.qualitygate.wait=true
