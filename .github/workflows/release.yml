name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.6.1). Required for manual dispatch.'
        required: true
        type: string
      force_rerelease:
        description: 'Overwrite the assets of an already-completed release for this tag.'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Least privilege by default: only the job that publishes assets elevates.
permissions:
  contents: read

env:
  GO_VERSION: '1.26'
  GORELEASER_VERSION: v2.13.0
  CYCLODEX_VERSION: v1.10.0

jobs:
  resolve-tag:
    name: Resolve tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      # The verified commit SHA, not the mutable tag name: everything
      # downstream checks out this SHA.
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Inputs are passed through env, never interpolated into the shell body:
      # a ${{ }} expansion inside `run` is a script-injection sink.
      - name: Resolve
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if ! printf '%s' "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ Not a v<major>.<minor>.<patch> tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      # The release must only ever be built from a commit that already passed
      # the gated main CI. A tag pushed onto an arbitrary commit (or a branch
      # that never reached main) is refused here, before anything is built.
      - name: Verify the tag points at a tested main commit
        id: verify
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -eu
          git fetch --quiet origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/tags/${TAG}:refs/tags/${TAG}"
          tag_sha="$(git rev-list -n 1 "refs/tags/${TAG}")"
          if ! git merge-base --is-ancestor "$tag_sha" origin/main; then
            echo "❌ ${TAG} ($tag_sha) is not contained in origin/main — refusing to release" >&2
            exit 1
          fi
          # Pin the SHA, not the tag name. Build, tests, and SBOM take minutes;
          # a tag can be force-moved in that window, so every later checkout
          # must use the commit that was verified here, not re-resolve the tag.
          echo "sha=$tag_sha" >> "$GITHUB_OUTPUT"
          echo "✓ ${TAG} resolves to $tag_sha, contained in origin/main"

  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: resolve-tag
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-tag.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build
        run: go build -o updash ./cmd/updash/
      - name: Test with race detector
        run: go test -race ./...

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # resolve-tag as direct dependency (see release-artifacts): the SBOM
    # must be generated from the tagged code, not the dispatch ref.
    needs: [resolve-tag, build-test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-tag.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Generate SBOM
        run: |
          set -eu
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@${{ env.CYCLODEX_VERSION }}
          cyclonedx-gomod mod -json -output bom.json .
          test -s bom.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: bom.json

  release-artifacts:
    name: GoReleaser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # resolve-tag must be a DIRECT dependency: the needs context does not
    # expose transitive outputs, so without it the tag ref resolves empty
    # on workflow_dispatch and the job silently checks out main.
    needs: [resolve-tag, build-test, sbom]
    outputs:
      artifacts-sha256: ${{ steps.hash.outputs.subjects }}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-tag.outputs.sha }}

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Multi-arch Docker support
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GoReleaser runs with replace_existing_artifacts so that a run which
      # died halfway can be re-dispatched. A release that already published
      # checksums.txt is complete, and silently replacing its assets would
      # break every checksum a user already recorded — that needs an explicit
      # force_rerelease dispatch.
      - name: Refuse to overwrite a completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
          FORCE: ${{ github.event.inputs.force_rerelease }}
        run: |
          set -eu
          if [ "$FORCE" = "true" ]; then
            echo "force_rerelease=true — overwriting assets of $TAG on purpose"
            exit 0
          fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets > /tmp/rel.json 2>/dev/null; then
            echo "✓ no existing release for $TAG"
            exit 0
          fi
          if jq -e '.assets[] | select(.name == "checksums.txt")' /tmp/rel.json >/dev/null; then
            echo "❌ $TAG already has a published checksums.txt — re-releasing would replace signed-off artifacts." >&2
            echo "   Delete the release first, or dispatch with force_rerelease=true." >&2
            exit 1
          fi
          echo "✓ $TAG exists but is incomplete (no checksums.txt) — recovering"

      - name: Install goreleaser
        run: go install github.com/goreleaser/goreleaser/v2@${{ env.GORELEASER_VERSION }}

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom

      - name: Clean up SBOM before GoReleaser
        run: rm -f bom.json

      - name: Run GoReleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          # HEAD is the verified SHA (detached), so name the tag explicitly
          # instead of letting GoReleaser re-derive it from the checkout.
          GORELEASER_CURRENT_TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: goreleaser release --clean --config goreleaser.github.yaml

      - name: Re-download SBOM for release attachment
        uses: actions/download-artifact@v4
        with:
          name: sbom

      - name: Attach SBOM to release
        uses: softprops/action-gh-release@v2
        with:
          files: bom.json
          # Release runs via workflow_dispatch (autotag pushes the tag with
          # GITHUB_TOKEN, which cannot trigger workflows), so the action cannot
          # infer the tag from GITHUB_REF — pass it explicitly.
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Compute SHA-256 subjects for SLSA provenance
      - name: Compute artifact hashes
        id: hash
        run: |
          set -eu
          cd dist
          subjects=""
          for f in *.tar.gz *.zip *.deb *.rpm *.apk; do
            [ -f "$f" ] || continue
            h=$(sha256sum "$f" | awk '{print $1}')
            subjects="${subjects}${h}  ${f}\n"
          done
          echo "subjects=$(printf '%b' "$subjects" | base64 -w0)" >> "$GITHUB_OUTPUT"

  # ── SLSA provenance (build L3) ──────────────────────────────────────────
  provenance:
    name: SLSA provenance
    needs: [release-artifacts, resolve-tag]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.release-artifacts.outputs.artifacts-sha256 }}"
      upload-assets: true
      upload-tag-name: "${{ needs.resolve-tag.outputs.tag }}"
