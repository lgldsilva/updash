name: Auto-tag

on:
  workflow_dispatch:
    inputs:
      tested_sha:
        description: 'Validated main commit to tag.'
        required: true
        type: string

concurrency: autotag-main

# Least privilege by default; the tagging job elevates explicitly.
permissions:
  contents: read

env:
  GO_VERSION: '1.26'
  SVU_VERSION: v3.2.1

jobs:
  autotag:
    name: Auto-tag (semver)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.repository == 'lgldsilva/updash'
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install svu
        run: go install github.com/caarlos0/svu/v3@${{ env.SVU_VERSION }}
      - name: Configure Git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Verify tested main commit
        env:
          TESTED_SHA: ${{ inputs.tested_sha }}
        run: |
          set -eu
          git fetch origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          if [ -n "$TESTED_SHA" ] && [ "$MAIN_SHA" != "$TESTED_SHA" ]; then
            echo "main advanced from tested commit $TESTED_SHA to $MAIN_SHA; skipping tag" >&2
            exit 1
          fi
          git checkout "$MAIN_SHA"
      - name: Compute next version
        id: svu
        run: |
          set -eu
          CURRENT="$(svu current)"
          NEXT="$(svu next)"
          echo "current=$CURRENT next=$NEXT"
          if [ "$NEXT" = "$CURRENT" ]; then
            echo "No version bump — skipping"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # svu returns full vX.Y.Z; do not double-prefix
          echo "tag=$NEXT" >> "$GITHUB_OUTPUT"
      - name: Create and push tag
        id: create_tag
        if: steps.svu.outputs.tag != ''
        env:
          VERSION: ${{ steps.svu.outputs.tag }}
        run: |
          set -eu
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "Tag $VERSION already exists — skipping"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "✓ Tagged and pushed $VERSION"
      - name: Dispatch release
        if: steps.create_tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.svu.outputs.tag }}
        run: |
          set -eu
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f tag="$VERSION"
