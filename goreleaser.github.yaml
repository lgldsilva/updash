# GoReleaser — cross-platform release artifacts for updash (GitHub).
#
# Builds the CLI for linux/macOS/Windows on amd64+arm64, packages each as
# tar.gz (zip on Windows) with LICENSE + README, emits SHA-256 checksums and a
# grouped changelog, and publishes a GitHub release.
#
# Distribution channels:
#   - GitHub Releases (archives + checksums + SBOM)
#   - Homebrew tap  → lgldsilva/homebrew-tap
#   - Scoop bucket  → lgldsilva/scoop-bucket
#   - Linux packages → .deb / .rpm / .apk
#   - Docker image  → ghcr.io/lgldsilva/updash
#
# Validate locally without publishing:
#   goreleaser check --config goreleaser.github.yaml
#   goreleaser release --snapshot --clean --config goreleaser.github.yaml
version: 2

project_name: updash

before:
  hooks:
    - go mod download

builds:
  - id: updash
    main: ./cmd/updash
    binary: updash
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.date={{ .Date }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: updash
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  sort: asc
  use: git
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - '^Merge '

release:
  github:
    owner: lgldsilva
    name: updash
  draft: false
  prerelease: auto
  # Re-dispatches of release.yml for an existing tag (the recovery path)
  # must overwrite the partial artifacts from a failed run instead of
  # dying on 422 already_exists.
  replace_existing_artifacts: true

# ── Homebrew ──────────────────────────────────────────────────────────────
# `brews` (formula) has been deprecated since GoReleaser v2.16. Casks install
# the same prebuilt binary. The tap still needs tap_migrations.json
# (`"updash": "updash"`) and Formula/updash.rb removed on the first release
# that publishes the cask, so existing formula installs follow along.
homebrew_casks:
  - name: updash
    repository:
      owner: lgldsilva
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/lgldsilva/updash"
    description: "System Update Dashboard — one binary for package updates, AI tools, and smart cleanup"
    license: MIT
    binaries: [updash]
    # Unsigned binary: without this, macOS Gatekeeper quarantine kills it.
    # install_steps is the non-deprecated form of the postflight hook.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/updash"]
          end

# ── Scoop (Windows) ──────────────────────────────────────────────────────
scoops:
  - name: updash
    repository:
      owner: lgldsilva
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    homepage: "https://github.com/lgldsilva/updash"
    description: "System Update Dashboard — one binary for package updates, AI tools, and smart cleanup"
    license: MIT

# ── Linux packages ───────────────────────────────────────────────────────
# Native Linux packages are attached to every GitHub release alongside the
# archives. They let users install through their distribution tooling without
# granting the application ownership of /usr/bin for self-updates.
nfpms:
  - id: updash-packages
    package_name: updash
    vendor: lgldsilva
    homepage: "https://github.com/lgldsilva/updash"
    maintainer: "Luiz Silva <lgldsilva@users.noreply.github.com>"
    description: >-
      System Update Dashboard for macOS, Linux, and Windows —
      one binary for package updates, AI tools, and smart cleanup.
    license: MIT
    formats: [deb, rpm, apk, archlinux]
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/updash/LICENSE
      - src: README.md
        dst: /usr/share/doc/updash/README.md

# ── Docker (GHCR) ────────────────────────────────────────────────────────
dockers_v2:
  - images:
      - "ghcr.io/lgldsilva/updash"
    tags:
      - "{{ .Version }}"
      - "latest"
    dockerfile: Dockerfile.goreleaser
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.source": "https://github.com/lgldsilva/updash"
